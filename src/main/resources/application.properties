spring.application.name=pixzeleria

# Database Configuration (uses environment variables on Railway, falls back to local)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pixzeleria}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Server port (Railway sets PORT automatically)
server.port=${PORT:8080}

# JWT Configuration
jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=36000000

management.endpoints.web.exposure.include=mappings